<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        .conteiner{
            background-color: rgb(168, 129, 56);
            display: flex;
            flex-flow: row nowrap;
        }

        .item{
            background-color: rgb(60, 60, 143);
            border: 1px solid black;
            text-align: center;
        }

        #cxA{
            flex: 1 0 250px;
        }

        #cxB{
            flex: 0 1 100px;
        }
        #cxC{
            flex: 1 8 auto;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
