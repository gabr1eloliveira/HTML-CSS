<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        .conteiner{
            background-color: rgb(168, 129, 56);
            display: flex;
            flex-flow: row nowrap;
        }

        .item{
            background-color: rgb(60, 60, 143);
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" style="flex-grow: 0; flex-shrink: 1;">A</div>
        <div class="item" style="flex-grow: 2; flex-shrink: 0;">B</div>
        <div class="item" style="flex-grow: 1; flex-shrink: 2;">C</div>
    </div>
</body>
</html>
